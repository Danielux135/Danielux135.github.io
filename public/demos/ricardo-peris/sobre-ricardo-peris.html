      /* Aplica el estilo guardado antes del primer pintado, para que la
         página no se vea un instante con el estilo de base. */
      (function () {
        try {
          var saved = localStorage.getItem('peris-about-style');
          var known = [
            'bloque', 'titular', 'contraste', 'editorial', 'albaran', 'plano', 'muro',
            'horizonte', 'cinta', 'ventanal', 'nave'
          ];
          if (known.indexOf(saved) !== -1) {
            document.documentElement.setAttribute('data-about-style', saved);
          }
        } catch (error) {
          /* Sin almacenamiento local se usa el estilo de base. */
        }
      })();
