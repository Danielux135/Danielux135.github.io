name: Clean FoskIA 2026-06-29 temporary files

on:
  push:
    branches: [main]
    paths:
      - '.foskia-publish-2026-06-29-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary publication files
        shell: bash
        run: |
          git config user.name "Danielux135"
          git config user.email "dlux135@hotmail.com"
          git rm -r .foskia-tmp/2026-06-29
          git rm .foskia-publish-2026-06-29-trigger
          git rm .github/workflows/publish-foskia-2026-06-29.yml
          git commit -m "Limpia archivos temporales de FoskIA del 2026-06-29"
          git push origin main
