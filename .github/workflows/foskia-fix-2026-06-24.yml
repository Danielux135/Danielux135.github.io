name: Fix FoskIA 2026-06-24

on:
  push:
    branches: [main]
    paths:
      - '.foskia-fix-2026-06-24-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact title replacements and validate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const postPath = 'public/foskia/posts/2026-06-24.json';
          const indexPath = 'public/foskia/posts/index.json';

          const replacements = [
            ['FoskIA 24/06: Epic apura regalos, Bitcoin cae bajo 63.000$, Europa se recalienta y la IA entra en fase de control', 'Epic apura regalos, Bitcoin cae bajo 63.000$, Europa se recalienta y la IA entra en fase de control'],
            ['FoskIA 24/06: Epic freebies expire, Bitcoin slips below $63K, Europe overheats and AI enters its control phase', 'Epic freebies expire, Bitcoin slips below $63K, Europe overheats and AI enters its control phase'],
            ['FoskIA 24/06: Epic apura regals, Bitcoin cau baix de 63.000$, Europa es recalfa i la IA entra en fase de control', 'Epic apura regals, Bitcoin cau baix de 63.000$, Europa es recalfa i la IA entra en fase de control']
          ];

          function replaceExactly(path) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              const count = text.split(from).length - 1;
              if (count > 1) throw new Error(`${path}: replacement source appears ${count} times: ${from}`);
              if (count === 1) text = text.replace(from, to);
              if (text.includes(from)) throw new Error(`${path}: forbidden prefix remains`);
            }
            JSON.parse(text);
            fs.writeFileSync(path, text, 'utf8');
          }

          replaceExactly(postPath);
          replaceExactly(indexPath);

          const post = JSON.parse(fs.readFileSync(postPath, 'utf8'));
          const expected = ['gaming','gratis','codigo','ciencia','economia','cripto','radar','ia','hardware','security','entretenimiento','curiosidades','ofertas','anime'];
          const actual = post.sections.map(s => s.category);
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected category order: ${actual.join(',')}`);
          }
          if (JSON.stringify(post).includes('FoskIA 24/06:')) throw new Error('Prefix remains in post');
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          if (JSON.stringify(index).includes('FoskIA 24/06:')) throw new Error('Prefix remains in index');
          console.log('Validation OK: both JSON parse, 14 categories preserved, prefix removed.');
          NODE

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "Danielux135"
          git config user.email "dlux135@hotmail.com"
          git add public/foskia/posts/2026-06-24.json public/foskia/posts/index.json
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Corrige titular de FoskIA del 2026-06-24"
          git push origin main
