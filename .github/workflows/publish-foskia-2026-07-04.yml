name: Publish FoskIA 2026-07-04

on:
  push:
    branches: [main]
    paths:
      - '.foskia-publish-2026-07-04-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate edition
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const date = '2026-07-04';
          const basePath = 'public/foskia/posts/2026-07-03.json';
          const postPath = `public/foskia/posts/${date}.json`;
          const indexPath = 'public/foskia/posts/index.json';
          const categories = ['gaming','gratis','codigo','ciencia','economia','cripto','radar','ia','hardware','security','entretenimiento','curiosidades','ofertas','anime'];
          const languages = ['es','en','val'];

          const edition = JSON.parse(JSON.stringify(JSON.parse(fs.readFileSync(basePath, 'utf8'))));
          edition.date = date;
          edition.title = {
            es: 'Black Torch se estrena, el calor marca el 4 de julio y los Minions buscan dominar la taquilla',
            en: 'Black Torch premieres, heat defines July 4 and the Minions chase the box-office lead',
            val: 'Black Torch s’estrena, la calor marca el 4 de juliol i els Minions busquen dominar la taquilla'
          };
          edition.intro = {
            es: 'La edición del 4 de julio llega con el estreno de Black Torch en Crunchyroll y la tercera jornada de Anime Expo, centrada en Bleach, Black Clover, My Hero Academia, Ghost in the Shell y Frieren. El Reuters Climate Monitor calcula que la temperatura máxima media global estará alrededor de 1 °C por encima de la referencia histórica, mientras decenas de millones de estadounidenses celebran el 250.º aniversario del país bajo avisos por una cúpula de calor. En cines, Minions & Monsters intenta liderar el largo fin de semana frente a Toy Story 5, y Epic mantiene activos sus dos nuevos juegos gratuitos.',
            en: 'The July 4 edition arrives with Black Torch premiering on Crunchyroll and Anime Expo entering its third day, led by Bleach, Black Clover, My Hero Academia, Ghost in the Shell and Frieren. Reuters Climate Monitor estimates the global average high will be about 1°C above its historical reference, while tens of millions of Americans celebrate the country’s 250th anniversary under heat-dome warnings. In cinemas, Minions & Monsters tries to lead the long weekend against Toy Story 5, while Epic keeps its two new free games active.',
            val: 'L’edició del 4 de juliol arriba amb l’estrena de Black Torch en Crunchyroll i la tercera jornada d’Anime Expo, centrada en Bleach, Black Clover, My Hero Academia, Ghost in the Shell i Frieren. Reuters Climate Monitor calcula que la temperatura màxima mitjana global estarà al voltant d’1 °C per damunt de la referència històrica, mentre desenes de milions de nord-americans celebren el 250é aniversari del país sota avisos per una cúpula de calor. Als cinemes, Minions & Monsters intenta liderar el llarg cap de setmana davant de Toy Story 5, i Epic manté actius els dos nous jocs gratuïts.'
          };
          edition.summary = {
            es: 'Black Torch inicia su emisión, Anime Expo concentra grandes paneles, el calor domina el 4 de julio y los Minions compiten por la taquilla festiva.',
            en: 'Black Torch begins airing, Anime Expo gathers major panels, heat dominates July 4 and the Minions compete for the holiday box office.',
            val: 'Black Torch inicia l’emissió, Anime Expo concentra grans panells, la calor domina el 4 de juliol i els Minions competixen per la taquilla festiva.'
          };
          edition.tags = [...categories];

          const section = category => {
            const found = edition.sections.find(entry => entry.category === category);
            if (!found) throw new Error(`Missing section ${category}`);
            return found;
          };

          section('ciencia').items[0] = {
            title: {
              es: 'El 4 de julio llega con una temperatura máxima global media 1 °C por encima de lo normal',
              en: 'July 4 arrives with the global average high about 1°C above normal',
              val: 'El 4 de juliol arriba amb una temperatura màxima global mitjana 1 °C per damunt del normal'
            },
            summary: {
              es: 'El Reuters Climate Monitor sitúa la máxima media mundial prevista aproximadamente 1 °C por encima de la referencia de 1961–1990. África presenta la mayor anomalía continental, cerca de 2,3 °C, mientras la ola de calor europea habría sido prácticamente imposible sin el calentamiento causado por el ser humano. El episodio coincide con avisos sanitarios y presión sobre las redes eléctricas; <a href="https://www.reuters.com/business/environment/see-how-abnormal-global-temperatures-are-right-now-2026-07-04/">Reuters reúne los datos</a>.',
              en: 'Reuters Climate Monitor places the forecast global average high roughly 1°C above the 1961–1990 reference. Africa shows the largest continental anomaly, near 2.3°C, while Europe’s heatwave would have been virtually impossible without human-caused warming. The event coincides with health warnings and pressure on electricity grids; <a href="https://www.reuters.com/business/environment/see-how-abnormal-global-temperatures-are-right-now-2026-07-04/">Reuters compiles the data</a>.',
              val: 'Reuters Climate Monitor situa la màxima mitjana mundial prevista aproximadament 1 °C per damunt de la referència de 1961–1990. Àfrica presenta l’anomalia continental més gran, prop de 2,3 °C, mentre l’onada de calor europea hauria sigut pràcticament impossible sense l’escalfament causat per l’ésser humà. L’episodi coincidix amb avisos sanitaris i pressió sobre les xarxes elèctriques; <a href="https://www.reuters.com/business/environment/see-how-abnormal-global-temperatures-are-right-now-2026-07-04/">Reuters reunix les dades</a>.'
            },
            source: 'Reuters Climate Monitor / WMO / World Weather Attribution',
            url: 'https://www.reuters.com/business/environment/see-how-abnormal-global-temperatures-are-right-now-2026-07-04/',
            links: [
              { title: { es: 'Reuters: anomalías térmicas del 4 de julio', en: 'Reuters: July 4 temperature anomalies', val: 'Reuters: anomalies tèrmiques del 4 de juliol' }, url: 'https://www.reuters.com/business/environment/see-how-abnormal-global-temperatures-are-right-now-2026-07-04/' },
              { title: { es: 'Organización Meteorológica Mundial', en: 'World Meteorological Organization', val: 'Organització Meteorològica Mundial' }, url: 'https://wmo.int/topics/el-nino-la-nina' },
              { title: { es: 'World Weather Attribution', en: 'World Weather Attribution', val: 'World Weather Attribution' }, url: 'https://www.worldweatherattribution.org/' }
            ]
          };

          section('radar').items[0] = {
            title: {
              es: 'Estados Unidos celebra su 250.º aniversario bajo una cúpula de calor histórica',
              en: 'The United States celebrates its 250th anniversary under a historic heat dome',
              val: 'Els Estats Units celebren el 250é aniversari sota una cúpula de calor històrica'
            },
            summary: {
              es: 'Decenas de millones de personas afrontan avisos por calor durante el fin de semana del 4 de julio, con sensaciones térmicas de entre 38 y 46 °C desde el Medio Oeste hasta la costa este. Nueva York amplía centros de refrigeración y pide reducir el consumo eléctrico en las horas punta, mientras trabajadores al aire libre y personas mayores concentran el mayor riesgo; <a href="https://www.reuters.com/business/environment/us-bakes-historic-heatwave-heading-into-july-4-holiday-2026-07-01/">Reuters sigue el episodio</a>.',
              en: 'Tens of millions of people face heat warnings over the July 4 weekend, with heat-index values of roughly 38–46°C from the Midwest to the East Coast. New York extends cooling centres and asks residents to reduce peak electricity use, while outdoor workers and older people face the greatest risk; <a href="https://www.reuters.com/business/environment/us-bakes-historic-heatwave-heading-into-july-4-holiday-2026-07-01/">Reuters tracks the event</a>.',
              val: 'Desenes de milions de persones afronten avisos per calor durant el cap de setmana del 4 de juliol, amb sensacions tèrmiques d’entre 38 i 46 °C des del Mig Oest fins a la costa est. Nova York amplia centres de refrigeració i demana reduir el consum elèctric en les hores punta, mentre treballadors a l’aire lliure i persones majors concentren el risc més gran; <a href="https://www.reuters.com/business/environment/us-bakes-historic-heatwave-heading-into-july-4-holiday-2026-07-01/">Reuters seguix l’episodi</a>.'
            },
            source: 'Reuters / National Weather Service / NYC Emergency Management',
            url: 'https://www.reuters.com/business/environment/us-bakes-historic-heatwave-heading-into-july-4-holiday-2026-07-01/',
            links: [
              { title: { es: 'Reuters: ola de calor del 4 de julio', en: 'Reuters: July 4 heatwave', val: 'Reuters: onada de calor del 4 de juliol' }, url: 'https://www.reuters.com/business/environment/us-bakes-historic-heatwave-heading-into-july-4-holiday-2026-07-01/' },
              { title: { es: 'Servicio Meteorológico Nacional: seguridad ante el calor', en: 'National Weather Service: heat safety', val: 'Servici Meteorològic Nacional: seguretat davant la calor' }, url: 'https://www.weather.gov/safety/heat' },
              { title: { es: 'Nueva York: preparación ante calor extremo', en: 'New York City: extreme heat preparedness', val: 'Nova York: preparació davant calor extrema' }, url: 'https://www.nyc.gov/site/em/ready/extreme-heat.page' }
            ]
          };

          section('entretenimiento').items[0] = {
            title: {
              es: 'Minions & Monsters encara el 4 de julio con previsiones inferiores a sus predecesoras',
              en: 'Minions & Monsters enters July 4 with projections below its predecessors',
              val: 'Minions & Monsters encara el 4 de juliol amb previsions inferiors a les predecessores'
            },
            summary: {
              es: 'Universal proyecta cerca de 90 millones de dólares en cinco días, mientras analistas sitúan el estreno entre 70 y 80 millones, por debajo de anteriores películas de los Minions. El presupuesto comunicado ronda 85 millones, lo que reduce el punto de equilibrio, pero Toy Story 5, el Mundial y el calor extremo añaden competencia; <a href="https://www.marketwatch.com/story/minions-movies-have-been-runaway-hits-but-is-franchise-fatigue-finally-setting-in-ba4f41da">MarketWatch analiza las previsiones</a>.',
              en: 'Universal projects about $90 million over five days, while analysts place the opening between $70 million and $80 million, below earlier Minions films. The reported budget is around $85 million, lowering the break-even point, but Toy Story 5, the World Cup and extreme heat add competition; <a href="https://www.marketwatch.com/story/minions-movies-have-been-runaway-hits-but-is-franchise-fatigue-finally-setting-in-ba4f41da">MarketWatch analyses the projections</a>.',
              val: 'Universal projecta prop de 90 milions de dòlars en cinc dies, mentre analistes situen l’estrena entre 70 i 80 milions, per davall d’anteriors pel·lícules dels Minions. El pressupost comunicat ronda 85 milions, cosa que reduïx el punt d’equilibri, però Toy Story 5, el Mundial i la calor extrema afegixen competència; <a href="https://www.marketwatch.com/story/minions-movies-have-been-runaway-hits-but-is-franchise-fatigue-finally-setting-in-ba4f41da">MarketWatch analitza les previsions</a>.'
            },
            source: 'MarketWatch / Illumination / El País',
            url: 'https://www.marketwatch.com/story/minions-movies-have-been-runaway-hits-but-is-franchise-fatigue-finally-setting-in-ba4f41da',
            links: [
              { title: { es: 'MarketWatch: previsiones de taquilla', en: 'MarketWatch: box-office projections', val: 'MarketWatch: previsions de taquilla' }, url: 'https://www.marketwatch.com/story/minions-movies-have-been-runaway-hits-but-is-franchise-fatigue-finally-setting-in-ba4f41da' },
              { title: { es: 'El País: estreno de Minions & Monsters', en: 'El País: Minions & Monsters release', val: 'El País: estrena de Minions & Monsters' }, url: 'https://elpais.com/suscripciones/elpaismas/2026-06-23/consigue-tus-entradas-para-el-estreno-de-minions-monsters.html' },
              { title: { es: 'Illumination', en: 'Illumination', val: 'Illumination' }, url: 'https://www.illumination.com/' }
            ]
          };

          section('entretenimiento').items[1] = {
            title: {
              es: 'Independence Day cumple 30 años como uno de los grandes símbolos del blockbuster moderno',
              en: 'Independence Day turns 30 as a defining symbol of the modern blockbuster',
              val: 'Independence Day complix 30 anys com un dels grans símbols del blockbuster modern'
            },
            summary: {
              es: 'La película de Roland Emmerich llegó a los cines estadounidenses el 3 de julio de 1996 y convirtió la destrucción de monumentos, los efectos digitales y la campaña del fin de semana festivo en una fórmula imitada durante décadas. Recaudó unos 817,4 millones de dólares en todo el mundo y ganó el Óscar a mejores efectos visuales; <a href="https://www.boxofficemojo.com/title/tt0116629/">Box Office Mojo conserva su recorrido comercial</a>.',
              en: 'Roland Emmerich’s film reached U.S. cinemas on July 3, 1996 and turned landmark destruction, digital effects and holiday-weekend marketing into a formula copied for decades. It earned about $817.4 million worldwide and won the Academy Award for visual effects; <a href="https://www.boxofficemojo.com/title/tt0116629/">Box Office Mojo preserves its commercial record</a>.',
              val: 'La pel·lícula de Roland Emmerich va arribar als cinemes nord-americans el 3 de juliol de 1996 i va convertir la destrucció de monuments, els efectes digitals i la campanya del cap de setmana festiu en una fórmula imitada durant dècades. Va recaptar uns 817,4 milions de dòlars a tot el món i va guanyar l’Oscar als millors efectes visuals; <a href="https://www.boxofficemojo.com/title/tt0116629/">Box Office Mojo conserva el recorregut comercial</a>.'
            },
            source: 'Box Office Mojo / 20th Century Studios / Academy Awards',
            url: 'https://www.boxofficemojo.com/title/tt0116629/',
            links: [
              { title: { es: 'Box Office Mojo', en: 'Box Office Mojo', val: 'Box Office Mojo' }, url: 'https://www.boxofficemojo.com/title/tt0116629/' },
              { title: { es: '20th Century Studios', en: '20th Century Studios', val: '20th Century Studios' }, url: 'https://www.20thcenturystudios.com/' },
              { title: { es: 'Premios Óscar', en: 'Academy Awards', val: 'Premis Oscar' }, url: 'https://www.oscars.org/oscars/ceremonies/1997' }
            ]
          };

          section('anime').items = [
            {
              title: {
                es: 'Black Torch se estrena hoy en Crunchyroll con Jiro Azuma y la guerra contra los mononoke',
                en: 'Black Torch premieres today on Crunchyroll with Jiro Azuma’s war against the mononoke',
                val: 'Black Torch s’estrena hui en Crunchyroll amb Jiro Azuma i la guerra contra els mononoke'
              },
              summary: {
                es: 'La adaptación del manga de Tsuyoshi Takaki inicia su emisión el 4 de julio. La historia sigue a un joven capaz de comunicarse con animales que se fusiona con un gato mononoke y queda atrapado en una batalla sobrenatural. 100studio produce la serie, con diseños de Go Suzuki y música de Yutaka Yamada; <a href="https://as.com/meristation/manga-y-anime/el-anime-de-accion-y-fantasia-mas-esperado-del-verano-es-inminente-fecha-trailer-y-plataforma-de-black-torch-f202606-n/">MeriStation confirma fecha y plataforma</a>.',
                en: 'The adaptation of Tsuyoshi Takaki’s manga begins airing on July 4. It follows a young man who can communicate with animals, merges with a mononoke cat and becomes trapped in a supernatural war. 100studio produces the series, with character designs by Go Suzuki and music by Yutaka Yamada; <a href="https://as.com/meristation/manga-y-anime/el-anime-de-accion-y-fantasia-mas-esperado-del-verano-es-inminente-fecha-trailer-y-plataforma-de-black-torch-f202606-n/">MeriStation confirms the date and platform</a>.',
                val: 'L’adaptació del manga de Tsuyoshi Takaki inicia l’emissió el 4 de juliol. La història seguix un jove capaç de comunicar-se amb animals que es fusiona amb un gat mononoke i queda atrapat en una batalla sobrenatural. 100studio produïx la sèrie, amb dissenys de Go Suzuki i música de Yutaka Yamada; <a href="https://as.com/meristation/manga-y-anime/el-anime-de-accion-y-fantasia-mas-esperado-del-verano-es-inminente-fecha-trailer-y-plataforma-de-black-torch-f202606-n/">MeriStation confirma la data i la plataforma</a>.'
              },
              source: 'MeriStation / Crunchyroll / Viz Media',
              url: 'https://as.com/meristation/manga-y-anime/el-anime-de-accion-y-fantasia-mas-esperado-del-verano-es-inminente-fecha-trailer-y-plataforma-de-black-torch-f202606-n/',
              links: [
                { title: { es: 'MeriStation: fecha, tráiler y plataforma', en: 'MeriStation: date, trailer and platform', val: 'MeriStation: data, tràiler i plataforma' }, url: 'https://as.com/meristation/manga-y-anime/el-anime-de-accion-y-fantasia-mas-esperado-del-verano-es-inminente-fecha-trailer-y-plataforma-de-black-torch-f202606-n/' },
                { title: { es: 'Noticias de Crunchyroll', en: 'Crunchyroll News', val: 'Notícies de Crunchyroll' }, url: 'https://www.crunchyroll.com/news' },
                { title: { es: 'Viz Media: Black Torch', en: 'Viz Media: Black Torch', val: 'Viz Media: Black Torch' }, url: 'https://www.viz.com/black-torch' }
              ]
            },
            {
              title: {
                es: 'Anime Expo dedica su tercera jornada a Bleach, Black Clover, My Hero Academia, Ghost in the Shell y Frieren',
                en: 'Anime Expo devotes day three to Bleach, Black Clover, My Hero Academia, Ghost in the Shell and Frieren',
                val: 'Anime Expo dedica la tercera jornada a Bleach, Black Clover, My Hero Academia, Ghost in the Shell i Frieren'
              },
              summary: {
                es: 'El programa del 4 de julio reúne paneles de Bleach: Thousand-Year Blood War, Atlus, Black Clover, Studio Trigger, Tokyo Revengers, el décimo aniversario de My Hero Academia, el nuevo Ghost in the Shell de Science Saru y un evento especial de Frieren. Es una de las jornadas más densas de la convención; <a href="https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/">GamesRadar detalla horarios y expectativas</a>.',
                en: 'The July 4 programme brings together panels for Bleach: Thousand-Year Blood War, Atlus, Black Clover, Studio Trigger, Tokyo Revengers, My Hero Academia’s tenth anniversary, Science Saru’s new Ghost in the Shell and a special Frieren event. It is one of the convention’s busiest days; <a href="https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/">GamesRadar details the timetable and expectations</a>.',
                val: 'El programa del 4 de juliol reunix panells de Bleach: Thousand-Year Blood War, Atlus, Black Clover, Studio Trigger, Tokyo Revengers, el desé aniversari de My Hero Academia, el nou Ghost in the Shell de Science Saru i un esdeveniment especial de Frieren. És una de les jornades més denses de la convenció; <a href="https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/">GamesRadar detalla horaris i expectatives</a>.'
              },
              source: 'Anime Expo / GamesRadar / SPJA',
              url: 'https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/',
              links: [
                { title: { es: 'GamesRadar: programa del tercer día', en: 'GamesRadar: day-three schedule', val: 'GamesRadar: programa del tercer dia' }, url: 'https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/' },
                { title: { es: 'Web oficial de Anime Expo', en: 'Official Anime Expo website', val: 'Web oficial d’Anime Expo' }, url: 'https://www.anime-expo.org/' },
                { title: { es: 'Society for the Promotion of Japanese Animation', en: 'Society for the Promotion of Japanese Animation', val: 'Society for the Promotion of Japanese Animation' }, url: 'https://spja.org/' }
              ]
            }
          ];

          const completeText = value => value && typeof value === 'object' && languages.every(lang => typeof value[lang] === 'string' && value[lang].trim());
          if (edition.date !== date) throw new Error('Wrong date');
          if (!completeText(edition.title) || !completeText(edition.intro) || !completeText(edition.summary)) throw new Error('Incomplete root translations');
          if (languages.some(lang => /^FoskIA\s+\d/i.test(edition.title[lang]))) throw new Error('Forbidden title prefix');
          if (JSON.stringify(edition.tags) !== JSON.stringify(categories)) throw new Error('Invalid tags');
          if (JSON.stringify(edition.sections.map(entry => entry.category)) !== JSON.stringify(categories)) throw new Error('Invalid category order');

          let itemCount = 0;
          for (const current of edition.sections) {
            if (!Array.isArray(current.items) || current.items.length === 0) throw new Error(`Empty category ${current.category}`);
            for (const [index, item] of current.items.entries()) {
              itemCount++;
              if (typeof item.url !== 'string' || !/^https?:\/\//.test(item.url)) throw new Error(`${current.category}[${index}] invalid URL`);
              if (!Array.isArray(item.links)) throw new Error(`${current.category}[${index}] invalid links`);
              if (current.category === 'ofertas') {
                if (!languages.includes(item.market)) throw new Error(`Invalid offer market ${index}`);
              } else {
                if (!completeText(item.title) || !completeText(item.summary)) throw new Error(`${current.category}[${index}] incomplete translations`);
                if (item.links.length < 3) throw new Error(`${current.category}[${index}] lacks sources`);
              }
              if (current.category === 'cripto' && (!completeText(item.shortTerm) || !completeText(item.longTerm))) throw new Error(`Crypto ${index} lacks analysis`);
            }
          }
          if (itemCount !== 32) throw new Error(`Expected 32 items, found ${itemCount}`);

          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          if (!index || !Array.isArray(index.editions)) throw new Error('Invalid index');
          index.editions = index.editions.filter(entry => entry && entry.date !== date);
          index.editions.push(edition);
          index.editions.sort((a, b) => b.date.localeCompare(a.date));
          if (index.editions.filter(entry => entry.date === date).length !== 1) throw new Error('Duplicate edition');

          fs.writeFileSync(postPath, JSON.stringify(edition, null, 2) + '\n');
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');
          JSON.parse(fs.readFileSync(postPath, 'utf8'));
          JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          console.log(`Validation OK: ${edition.sections.length} categories, ${itemCount} items.`);
          NODE

      - name: Commit edition
        shell: bash
        run: |
          git config user.name "Danielux135"
          git config user.email "dlux135@hotmail.com"
          git add public/foskia/posts/2026-07-04.json public/foskia/posts/index.json
          git commit -m "Edición de FoskIA del 2026-07-04"
          git push origin main

      - name: Remove temporary publication files
        shell: bash
        run: |
          rm -f .foskia-publish-2026-07-04-trigger
          rm -f .github/workflows/publish-foskia-2026-07-04.yml
          git add -A
          git commit -m "Limpia archivos temporales de FoskIA del 2026-07-04"
          git push origin main
