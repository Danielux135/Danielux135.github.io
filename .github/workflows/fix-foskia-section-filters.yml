name: Fix FoskIA section filters

on:
  push:
    branches: [main]
    paths:
      - '.foskia-fix-section-filters-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix category discovery and validate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/foskia/index.html';
          let html = fs.readFileSync(path, 'utf8');

          const helperAnchor = 'function catLabel(k){ return CATS[k]?CATS[k].label[lang]||CATS[k].label.es:k; }';
          const helper = `${helperAnchor}\nfunction editionTags(e){\n  return [...new Set([\n    ...(Array.isArray(e?.tags)?e.tags:[]),\n    ...(Array.isArray(e?.sections)?e.sections.map(s=>s?.category).filter(Boolean):[])\n  ])];\n}`;

          if (!html.includes('function editionTags(e){')) {
            const count = html.split(helperAnchor).length - 1;
            if (count !== 1) throw new Error(`Expected one catLabel anchor, found ${count}`);
            html = html.replace(helperAnchor, helper);
          }

          const oldUsed = 'const used=new Set(); EDITIONS.forEach(e=>(e.tags||[]).forEach(t=>used.add(t)));';
          const newUsed = 'const used=new Set(); EDITIONS.forEach(e=>editionTags(e).forEach(t=>used.add(t)));';
          if (html.includes(oldUsed)) html = html.replace(oldUsed, newUsed);

          const oldFilter = 'const eds=EDITIONS.filter(e=>(e.tags||[]).includes(cat));';
          const newFilter = 'const eds=EDITIONS.filter(e=>editionTags(e).includes(cat));';
          if (html.includes(oldFilter)) html = html.replace(oldFilter, newFilter);

          if (!html.includes(newUsed)) throw new Error('renderChips was not updated');
          if (!html.includes(newFilter)) throw new Error('renderFeed was not updated');
          if ((html.match(/function editionTags\(e\)\{/g)||[]).length !== 1) throw new Error('editionTags helper missing or duplicated');

          const index = JSON.parse(fs.readFileSync('public/foskia/posts/index.json', 'utf8'));
          const ed = (index.editions||[]).find(e=>e.date==='2026-07-13');
          if (!ed) throw new Error('Edition 2026-07-13 not found');
          const derived = [...new Set([...(ed.tags||[]),...(ed.sections||[]).map(s=>s.category).filter(Boolean)])];
          const expected = ['gaming','gratis','codigo','ciencia','economia','cripto','radar','ia','hardware','security','entretenimiento','curiosidades','ofertas','anime'];
          for (const cat of expected) if (!derived.includes(cat)) throw new Error(`2026-07-13 missing category ${cat}`);

          fs.writeFileSync(path, html, 'utf8');
          console.log(`Validation OK: ${derived.length} categories discovered for 2026-07-13.`);
          NODE

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Danielux135"
          git config user.email "dlux135@hotmail.com"
          git add public/foskia/index.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Corrige el filtrado por secciones de FoskIA"
          git push origin main
