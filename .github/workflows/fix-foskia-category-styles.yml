name: Fix FoskIA category styles

on:
  push:
    branches: [main]
    paths:
      - '.foskia-category-styles-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add missing category styles
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/foskia/index.html';
          let text = fs.readFileSync(path, 'utf8');

          const tagAnchor = '.cat-radar   .sec-tag{color:var(--rose);   background:rgba(251,113,133,.1); border:1px solid rgba(251,113,133,.2)}';
          const tagRules = `${tagAnchor}\n.cat-ia      .sec-tag{color:var(--blue);   background:rgba(125,211,252,.1); border:1px solid rgba(125,211,252,.2)}\n.cat-hardware .sec-tag{color:var(--amber); background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.2)}\n.cat-security .sec-tag{color:var(--green); background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.2)}\n.cat-entretenimiento .sec-tag{color:var(--purple); background:rgba(192,132,252,.1); border:1px solid rgba(192,132,252,.2)}\n.cat-curiosidades .sec-tag{color:var(--accent2); background:rgba(163,230,53,.1); border:1px solid rgba(163,230,53,.2)}\n.cat-ofertas .sec-tag{color:var(--rose); background:rgba(251,113,133,.1); border:1px solid rgba(251,113,133,.2)}\n.cat-anime   .sec-tag{color:var(--accent); background:rgba(94,234,212,.1); border:1px solid rgba(94,234,212,.2)}`;

          const barAnchor = '.cat-radar   .item::before{background:var(--rose)}';
          const barRules = `${barAnchor}\n.cat-ia      .item::before{background:var(--blue)}\n.cat-hardware .item::before{background:var(--amber)}\n.cat-security .item::before{background:var(--green)}\n.cat-entretenimiento .item::before{background:var(--purple)}\n.cat-curiosidades .item::before{background:var(--accent2)}\n.cat-ofertas .item::before{background:var(--rose)}\n.cat-anime   .item::before{background:var(--accent)}`;

          if (!text.includes('.cat-ia      .sec-tag')) {
            if (!text.includes(tagAnchor)) throw new Error('Tag CSS anchor not found');
            text = text.replace(tagAnchor, tagRules);
          }
          if (!text.includes('.cat-ia      .item::before')) {
            if (!text.includes(barAnchor)) throw new Error('Item CSS anchor not found');
            text = text.replace(barAnchor, barRules);
          }

          for (const cat of ['ia','hardware','security','entretenimiento','curiosidades','ofertas','anime']) {
            if (!text.includes(`.cat-${cat} `)) throw new Error(`Missing CSS for ${cat}`);
          }
          fs.writeFileSync(path, text, 'utf8');
          NODE

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Danielux135"
          git config user.email "dlux135@hotmail.com"
          git add public/foskia/index.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Corrige estilos de categorías de FoskIA"
          git push origin main
