name: Publish FoskIA 2026-07-02

on:
  push:
    branches: [main]
    paths:
      - '.foskia-publish-2026-07-02-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate edition
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const date = '2026-07-02';
          const basePath = 'public/foskia/posts/2026-07-01.json';
          const postPath = `public/foskia/posts/${date}.json`;
          const indexPath = 'public/foskia/posts/index.json';
          const categories = ['gaming','gratis','codigo','ciencia','economia','cripto','radar','ia','hardware','security','entretenimiento','curiosidades','ofertas','anime'];
          const langs = ['es','en','val'];
          const edition = JSON.parse(fs.readFileSync(basePath, 'utf8'));
          const tr = (es,en,val) => ({es,en,val});
          const link = (es,en,val,url) => ({title:tr(es,en,val),url});

          edition.date = date;
          edition.title = tr(
            'La industria se rebela contra el fin del disco, Anime Expo abre sus puertas y Europa prolonga la alerta por calor',
            'The games industry rebels against the end of discs, Anime Expo opens and Europe extends its heat alert',
            'La indústria es rebel·la contra el final del disc, Anime Expo obri les portes i Europa prolonga l’alerta per calor'
          );
          edition.intro = tr(
            'La edición del 2 de julio recoge la primera gran respuesta de desarrolladores, editores y antiguos directivos al anuncio de Sony de abandonar los nuevos juegos físicos en 2028. Anime Expo abre en Los Ángeles con cuatro días de estrenos y anuncios, mientras Europa sigue bajo calor extremo, los mercados comienzan el segundo semestre cerca de máximos y Bitcoin intenta sostener los 60.000 dólares. En tecnología continúan el debate sobre agentes de programación, la inversión en IA y las vulnerabilidades de Windows ya explotadas.',
            'The July 2 edition captures the first major response from developers, publishers and former executives to Sony’s plan to end new physical game releases in 2028. Anime Expo opens in Los Angeles with four days of premieres and announcements, while Europe remains under extreme heat, markets begin the second half near record levels and Bitcoin tries to hold $60,000. Technology coverage continues to focus on coding agents, AI investment and already-exploited Windows vulnerabilities.',
            'L’edició del 2 de juliol arreplega la primera gran resposta de desenvolupadors, editors i antics directius a l’anunci de Sony d’abandonar els nous jocs físics en 2028. Anime Expo obri a Los Angeles amb quatre dies d’estrenes i anuncis, mentre Europa continua sota calor extrema, els mercats comencen el segon semestre prop de màxims i Bitcoin intenta mantindre els 60.000 dòlars. En tecnologia continuen el debat sobre agents de programació, la inversió en IA i les vulnerabilitats de Windows ja explotades.'
          );
          edition.summary = tr(
            'La industria del videojuego responde a Sony, Anime Expo inicia su edición de 2026, Europa mantiene las alertas por calor y Bitcoin busca consolidar su rebote.',
            'The games industry responds to Sony, Anime Expo begins its 2026 event, Europe keeps heat alerts in place and Bitcoin seeks to consolidate its rebound.',
            'La indústria del videojoc respon a Sony, Anime Expo inicia l’edició de 2026, Europa manté les alertes per calor i Bitcoin busca consolidar el rebot.'
          );
          edition.tags = categories.slice();

          const section = name => edition.sections.find(s => s.category === name);

          section('gaming').items[0] = {
            title: tr(
              'Mike Ybarra exige garantías reales antes de que PlayStation abandone el formato físico',
              'Mike Ybarra demands real guarantees before PlayStation abandons physical media',
              'Mike Ybarra exigix garanties reals abans que PlayStation abandone el format físic'
            ),
            summary: tr(
              'El antiguo presidente de Blizzard y exdirectivo de Xbox sostiene que los jugadores no pueden vivir con el temor de perder sus compras digitales. Propone bibliotecas permanentes, préstamo entre usuarios y mecanismos de reventa antes de normalizar un ecosistema sin discos; <a href="https://www.gamesradar.com/games/as-playstation-kills-discs-former-blizzard-boss-says-we-cant-live-in-a-world-of-fear-if-our-games-will-work-in-the-future-or-not/">GamesRadar</a> recoge sus propuestas.',
              'The former Blizzard president and Xbox executive says players cannot live with the fear of losing digital purchases. He calls for permanent libraries, user-to-user lending and resale mechanisms before a disc-free ecosystem becomes normal; <a href="https://www.gamesradar.com/games/as-playstation-kills-discs-former-blizzard-boss-says-we-cant-live-in-a-world-of-fear-if-our-games-will-work-in-the-future-or-not/">GamesRadar</a> covers his proposals.',
              'L’antic president de Blizzard i exdirectiu de Xbox sosté que els jugadors no poden viure amb la por de perdre les compres digitals. Proposa biblioteques permanents, préstec entre usuaris i mecanismes de revenda abans de normalitzar un ecosistema sense discos; <a href="https://www.gamesradar.com/games/as-playstation-kills-discs-former-blizzard-boss-says-we-cant-live-in-a-world-of-fear-if-our-games-will-work-in-the-future-or-not/">GamesRadar</a> arreplega les propostes.'
            ),
            source:'GamesRadar / Reuters / People',
            url:'https://www.gamesradar.com/games/as-playstation-kills-discs-former-blizzard-boss-says-we-cant-live-in-a-world-of-fear-if-our-games-will-work-in-the-future-or-not/',
            links:[
              link('GamesRadar: propuestas de Mike Ybarra','GamesRadar: Mike Ybarra’s proposals','GamesRadar: propostes de Mike Ybarra','https://www.gamesradar.com/games/as-playstation-kills-discs-former-blizzard-boss-says-we-cant-live-in-a-world-of-fear-if-our-games-will-work-in-the-future-or-not/'),
              link('Reuters: anuncio de Sony','Reuters: Sony announcement','Reuters: anunci de Sony','https://www.reuters.com/world/asia-pacific/sony-end-discs-new-playstation-releases-gaming-shifts-online-2026-07-01/'),
              link('People: detalles del cambio','People: details of the shift','People: detalls del canvi','https://people.com/playstation-is-ending-physical-game-discs-for-new-releases-beginning-in-2028-12010985')
            ]
          };

          section('gaming').items[1] = {
            title: tr(
              'Estudios y editores califican de “desgarrador” el final de los nuevos discos de PlayStation',
              'Studios and publishers call the end of new PlayStation discs “heartbreaking”',
              'Estudis i editors qualifiquen de “desolador” el final dels nous discos de PlayStation'
            ),
            summary: tr(
              'Responsables vinculados a Baldur’s Gate 3, Silksong, Animal Well y The Binding of Isaac defienden el valor cultural, comercial y de conservación de las ediciones físicas. Los sellos especializados prometen seguir publicándolas mientras sea posible, aunque las restricciones de plataforma pueden reducir mucho su alcance; <a href="https://www.gamesradar.com/games/long-live-physical-media-devs-and-publishers-of-baldurs-gate-3-silksong-and-more-call-sonys-decision-to-end-physical-playstation-games-genuinely-heartbreaking/">GamesRadar</a> reúne las reacciones.',
              'People connected to Baldur’s Gate 3, Silksong, Animal Well and The Binding of Isaac defend the cultural, commercial and preservation value of physical editions. Specialist publishers promise to continue producing them where possible, although platform restrictions may sharply limit their reach; <a href="https://www.gamesradar.com/games/long-live-physical-media-devs-and-publishers-of-baldurs-gate-3-silksong-and-more-call-sonys-decision-to-end-physical-playstation-games-genuinely-heartbreaking/">GamesRadar</a> collects the responses.',
              'Responsables vinculats a Baldur’s Gate 3, Silksong, Animal Well i The Binding of Isaac defenen el valor cultural, comercial i de conservació de les edicions físiques. Els segells especialitzats prometen continuar publicant-les mentre siga possible, encara que les restriccions de plataforma poden reduir-ne molt l’abast; <a href="https://www.gamesradar.com/games/long-live-physical-media-devs-and-publishers-of-baldurs-gate-3-silksong-and-more-call-sonys-decision-to-end-physical-playstation-games-genuinely-heartbreaking/">GamesRadar</a> reunix les reaccions.'
            ),
            source:'GamesRadar / Lost in Cult / Larian Studios',
            url:'https://www.gamesradar.com/games/long-live-physical-media-devs-and-publishers-of-baldurs-gate-3-silksong-and-more-call-sonys-decision-to-end-physical-playstation-games-genuinely-heartbreaking/',
            links:[
              link('GamesRadar: reacción de estudios y editores','GamesRadar: developer and publisher reaction','GamesRadar: reacció d’estudis i editors','https://www.gamesradar.com/games/long-live-physical-media-devs-and-publishers-of-baldurs-gate-3-silksong-and-more-call-sonys-decision-to-end-physical-playstation-games-genuinely-heartbreaking/'),
              link('Lost in Cult','Lost in Cult','Lost in Cult','https://www.lostincult.co.uk/'),
              link('Larian Studios','Larian Studios','Larian Studios','https://larian.com/')
            ]
          };

          section('entretenimiento').items[0] = {
            title: tr(
              'Minions & Monsters inaugura julio y pone a prueba el tirón de Illumination en verano',
              'Minions & Monsters opens July and tests Illumination’s summer appeal',
              'Minions & Monsters inaugura juliol i posa a prova l’atracció estiuenca d’Illumination'
            ),
            summary: tr(
              'La nueva película animada de Illumination llega a los cines al inicio de julio con una mezcla de comedia, criaturas y el universo de los Minions. Su rendimiento servirá para medir si la franquicia mantiene su fuerza fuera de las entregas principales de Despicable Me; la información oficial se concentra en <a href="https://www.illumination.com/">Illumination</a>.',
              'Illumination’s new animated film reaches cinemas at the start of July with a mix of comedy, creatures and the Minions universe. Its performance will test whether the franchise remains strong outside the main Despicable Me entries; official information is available through <a href="https://www.illumination.com/">Illumination</a>.',
              'La nova pel·lícula animada d’Illumination arriba als cinemes al començament de juliol amb una mescla de comèdia, criatures i l’univers dels Minions. El rendiment servirà per a mesurar si la franquícia manté la força fora de les entregues principals de Despicable Me; la informació oficial es concentra en <a href="https://www.illumination.com/">Illumination</a>.'
            ),
            source:'Illumination / Universal Pictures / Box Office Mojo',
            url:'https://www.illumination.com/',
            links:[
              link('Illumination','Illumination','Illumination','https://www.illumination.com/'),
              link('Universal Pictures','Universal Pictures','Universal Pictures','https://www.universalpictures.com/'),
              link('Box Office Mojo','Box Office Mojo','Box Office Mojo','https://www.boxofficemojo.com/')
            ]
          };

          section('anime').items[0] = {
            title: tr(
              'Anime Expo 2026 abre en Los Ángeles con cuatro días de estrenos y anuncios',
              'Anime Expo 2026 opens in Los Angeles with four days of premieres and announcements',
              'Anime Expo 2026 obri a Los Angeles amb quatre dies d’estrenes i anuncis'
            ),
            summary: tr(
              'El encuentro arranca el 2 de julio con paneles dedicados a Cyberpunk: Edgerunners, Demon Slayer, The Apothecary Diaries y el nuevo The Ghost in the Shell. La agenda combina estrenos mundiales, avances y sesiones con estudios japoneses; <a href="https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/">GamesRadar</a> resume los anuncios más esperados.',
              'The event begins on July 2 with panels covering Cyberpunk: Edgerunners, Demon Slayer, The Apothecary Diaries and the new The Ghost in the Shell. The programme combines world premieres, previews and sessions with Japanese studios; <a href="https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/">GamesRadar</a> summarises the most anticipated announcements.',
              'La trobada arranca el 2 de juliol amb panells dedicats a Cyberpunk: Edgerunners, Demon Slayer, The Apothecary Diaries i el nou The Ghost in the Shell. L’agenda combina estrenes mundials, avanços i sessions amb estudis japonesos; <a href="https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/">GamesRadar</a> resumix els anuncis més esperats.'
            ),
            source:'GamesRadar / Anime Expo / Crunchyroll',
            url:'https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/',
            links:[
              link('GamesRadar: guía de Anime Expo','GamesRadar: Anime Expo guide','GamesRadar: guia d’Anime Expo','https://www.gamesradar.com/entertainment/anime-shows/anime-expo-2026-schedule-announcements/'),
              link('Web oficial de Anime Expo','Official Anime Expo website','Web oficial d’Anime Expo','https://www.anime-expo.org/'),
              link('Noticias de Crunchyroll','Crunchyroll News','Notícies de Crunchyroll','https://www.crunchyroll.com/news')
            ]
          };

          section('anime').items[1] = {
            title: tr(
              'BanG Dream! Yume∞Mita se estrena en Japón con una nueva banda virtual',
              'BanG Dream! Yume∞Mita premieres in Japan with a new virtual band',
              'BanG Dream! Yume∞Mita s’estrena al Japó amb una nova banda virtual'
            ),
            summary: tr(
              'La nueva serie del universo BanG Dream! debuta el 2 de julio en Tokyo MX y otras cadenas, centrada en Mugendai Mewtype y su identidad digital. La producción amplía la franquicia hacia una estética más ligada a actuaciones virtuales y redes sociales; la información de emisión puede consultarse en la <a href="https://bang-dream.com/">web oficial</a>.',
              'The new BanG Dream! series premieres on July 2 on Tokyo MX and other networks, focusing on Mugendai Mewtype and its digital identity. The production expands the franchise towards virtual performances and social-media culture; broadcast information is available on the <a href="https://bang-dream.com/">official website</a>.',
              'La nova sèrie de l’univers BanG Dream! debuta el 2 de juliol en Tokyo MX i altres cadenes, centrada en Mugendai Mewtype i la seua identitat digital. La producció amplia la franquícia cap a una estètica més lligada a actuacions virtuals i xarxes socials; la informació d’emissió es pot consultar en la <a href="https://bang-dream.com/">web oficial</a>.'
            ),
            source:'BanG Dream! / Tokyo MX / MyAnimeList',
            url:'https://bang-dream.com/',
            links:[
              link('Web oficial de BanG Dream!','Official BanG Dream! website','Web oficial de BanG Dream!','https://bang-dream.com/'),
              link('Tokyo MX','Tokyo MX','Tokyo MX','https://s.mxtv.jp/'),
              link('MyAnimeList','MyAnimeList','MyAnimeList','https://myanimelist.net/')
            ]
          };

          if (!Array.isArray(edition.sections)) throw new Error('sections missing');
          if (JSON.stringify(edition.sections.map(s=>s.category)) !== JSON.stringify(categories)) throw new Error('wrong category order');
          let count = 0;
          for (const s of edition.sections) {
            if (!Array.isArray(s.items) || !s.items.length) throw new Error(`empty ${s.category}`);
            for (const item of s.items) {
              count++;
              if (!/^https?:\/\//.test(item.url || '')) throw new Error(`invalid URL in ${s.category}`);
              if (s.category !== 'ofertas') {
                for (const field of ['title','summary']) for (const lang of langs) if (!String(item[field]?.[lang] || '').trim()) throw new Error(`missing ${field}.${lang} in ${s.category}`);
                if (!Array.isArray(item.links) || item.links.length < 3) throw new Error(`not enough links in ${s.category}`);
              }
              if (s.category === 'cripto') {
                for (const field of ['shortTerm','longTerm']) for (const lang of langs) if (!String(item[field]?.[lang] || '').trim()) throw new Error(`missing crypto ${field}.${lang}`);
              }
            }
          }
          for (const lang of langs) {
            if (!edition.title[lang] || /^FoskIA\b/i.test(edition.title[lang])) throw new Error(`invalid root title ${lang}`);
          }

          const index = JSON.parse(fs.readFileSync(indexPath,'utf8'));
          if (!Array.isArray(index.editions)) throw new Error('invalid index schema');
          index.editions = index.editions.filter(e => e?.date !== date);
          index.editions.push(edition);
          index.editions.sort((a,b)=>b.date.localeCompare(a.date));
          if (index.editions.filter(e=>e.date===date).length !== 1) throw new Error('duplicate edition');

          fs.writeFileSync(postPath, JSON.stringify(edition,null,2)+'\n');
          fs.writeFileSync(indexPath, JSON.stringify(index,null,2)+'\n');
          JSON.parse(fs.readFileSync(postPath,'utf8'));
          JSON.parse(fs.readFileSync(indexPath,'utf8'));
          console.log(`OK: ${count} items across ${categories.length} categories`);
          NODE

      - name: Commit edition
        shell: bash
        run: |
          git config user.name "Danielux135"
          git config user.email "dlux135@hotmail.com"
          git add public/foskia/posts/2026-07-02.json public/foskia/posts/index.json
          git commit -m "Edición de FoskIA del 2026-07-02"
          git push origin main

      - name: Clean temporary files
        shell: bash
        run: |
          rm -f .foskia-publish-2026-07-02-trigger
          rm -f .github/workflows/publish-foskia-2026-07-02.yml
          git add -A
          git commit -m "Limpia archivos temporales de FoskIA del 2026-07-02"
          git push origin main
