name: Publish FoskIA 2026-07-01

on:
  push:
    branches: [main]
    paths:
      - '.foskia-publish-2026-07-01-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild, validate and publish edition
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const date = '2026-07-01';
          const sourceDir = '.foskia-tmp/2026-07-01';
          const postPath = `public/foskia/posts/${date}.json`;
          const indexPath = 'public/foskia/posts/index.json';
          const expectedHash = '8c790f771c3003e7737cf91698401f23b2611202f24cb03acbf7f3e6e1a3cc5b';
          const expectedCategories = ['gaming','gratis','codigo','ciencia','economia','cripto','radar','ia','hardware','security','entretenimiento','curiosidades','ofertas','anime'];
          const languages = ['es','en','val'];

          function fail(message) { throw new Error(message); }
          function validUrl(value) { return typeof value === 'string' && /^https?:\/\//.test(value); }
          function completeText(value) {
            return value && typeof value === 'object' && languages.every(lang => typeof value[lang] === 'string' && value[lang].trim());
          }

          const parts = fs.readdirSync(sourceDir)
            .filter(name => /^part-\d{2}[a-z]?\.txt$/.test(name))
            .sort();
          if (parts.length !== 18) fail(`Expected 18 source parts, found ${parts.length}`);

          const source = parts.map(name => fs.readFileSync(`${sourceDir}/${name}`, 'utf8')).join('');
          const actualHash = crypto.createHash('sha256').update(source).digest('hex');
          if (actualHash !== expectedHash) fail(`Unexpected source hash: ${actualHash}`);

          const edition = JSON.parse(source);
          if (edition.date !== date) fail(`Wrong date: ${edition.date}`);
          if (!completeText(edition.title) || !completeText(edition.intro) || !completeText(edition.summary)) fail('Incomplete root translations');
          if (languages.some(lang => /^(FoskIA|Edici[oó]n del d[ií]a|Edition of the day)/i.test(edition.title[lang]))) fail('Forbidden title prefix');
          if (JSON.stringify(edition.tags) !== JSON.stringify(expectedCategories)) fail('Unexpected root tags');
          if (!Array.isArray(edition.sections)) fail('sections must be an array');

          const actualCategories = edition.sections.map(section => section.category);
          if (JSON.stringify(actualCategories) !== JSON.stringify(expectedCategories)) fail(`Unexpected category order: ${actualCategories.join(',')}`);

          let itemCount = 0;
          for (const section of edition.sections) {
            if (!Array.isArray(section.items) || section.items.length === 0) fail(`Empty category: ${section.category}`);
            for (const [index, item] of section.items.entries()) {
              itemCount++;
              if (!validUrl(item.url)) fail(`${section.category}[${index}] invalid primary URL`);
              if (!Array.isArray(item.links)) fail(`${section.category}[${index}] links must be an array`);
              for (const link of item.links) if (!validUrl(link.url)) fail(`${section.category}[${index}] invalid link URL`);

              if (section.category === 'ofertas') {
                if (!languages.includes(item.market)) fail(`Offer ${index} has invalid market`);
                for (const field of ['title','summary','originalPrice','salePrice','discount','until']) {
                  const value = item[field];
                  if (!value || typeof value !== 'object' || !String(value[item.market] || '').trim()) fail(`Offer ${index} incomplete ${field}`);
                  for (const lang of languages) if (lang !== item.market && String(value[lang] || '').trim()) fail(`Offer ${index} leaks ${field} into ${lang}`);
                }
              } else {
                if (!completeText(item.title) || !completeText(item.summary)) fail(`${section.category}[${index}] incomplete translations`);
                if (item.links.length < 3) fail(`${section.category}[${index}] has fewer than three sources`);
              }

              if (section.category === 'cripto' && (!completeText(item.shortTerm) || !completeText(item.longTerm))) fail(`Crypto ${index} lacks analysis horizons`);
            }
          }
          if (itemCount !== 32) fail(`Expected 32 items, found ${itemCount}`);

          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          if (!index || !Array.isArray(index.editions)) fail('Invalid index schema');
          index.editions = index.editions.filter(entry => entry && entry.date !== date);
          index.editions.push(edition);
          index.editions.sort((a, b) => b.date.localeCompare(a.date));
          if (index.editions.filter(entry => entry.date === date).length !== 1) fail('Edition duplicated in index');
          if (index.editions.some((entry, i, arr) => i > 0 && arr[i - 1].date < entry.date)) fail('Index is not descending');

          fs.writeFileSync(postPath, JSON.stringify(edition, null, 2) + '\n', 'utf8');
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n', 'utf8');
          JSON.parse(fs.readFileSync(postPath, 'utf8'));
          JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          console.log(`Validation OK: ${actualCategories.length} categories, ${itemCount} items, index updated once.`);
          NODE

      - name: Commit edition
        shell: bash
        run: |
          git config user.name "Danielux135"
          git config user.email "dlux135@hotmail.com"
          git add public/foskia/posts/2026-07-01.json public/foskia/posts/index.json
          if git diff --cached --quiet; then
            echo "No edition changes required"
          else
            git commit -m "Edición de FoskIA del 2026-07-01"
            git push origin main
          fi

      - name: Remove temporary publication files
        shell: bash
        run: |
          git pull --rebase origin main
          rm -rf .foskia-tmp/2026-07-01
          rm -f .foskia-publish-2026-07-01-trigger
          rm -f .github/workflows/publish-foskia-2026-07-01.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No temporary files to remove"
          else
            git commit -m "Limpia archivos temporales de FoskIA del 2026-07-01"
            git push origin main
          fi
