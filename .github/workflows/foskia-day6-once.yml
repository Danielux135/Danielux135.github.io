name: Publicar FoskIA 2026-07-06

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/foskia-day6-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generar edición e índice
        shell: bash
        env:
          FOSKIA_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, json, os, pathlib, re
          root = pathlib.Path('public/foskia/posts')
          root.mkdir(parents=True, exist_ok=True)
          raw = gzip.decompress(base64.b64decode(os.environ['FOSKIA_GZ_B64'])).decode('utf-8')
          edition = json.loads(raw)
          if edition.get('date') != '2026-07-06':
              raise SystemExit('Fecha incorrecta')
          (root / '2026-07-06.json').write_text(json.dumps(edition, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          pattern = re.compile(r'^\d{4}-\d{2}-\d{2}\.json$')
          paths = sorted((p for p in root.glob('*.json') if pattern.fullmatch(p.name)), key=lambda p: p.name, reverse=True)
          editions = [json.loads(p.read_text(encoding='utf-8')) for p in paths]
          (root / 'index.json').write_text(json.dumps({'editions': editions}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          pathlib.Path('.github/workflows/foskia-day6-once.yml').unlink()
          PY
      - name: Validar y publicar
        shell: bash
        run: |
          python -m json.tool public/foskia/posts/2026-07-06.json > /dev/null
          python -m json.tool public/foskia/posts/index.json > /dev/null
          node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync("public/foskia/posts/2026-07-06.json","utf8"));const i=JSON.parse(fs.readFileSync("public/foskia/posts/index.json","utf8"));if(e.date!=="2026-07-06"||i.editions.filter(x=>x.date==="2026-07-06").length!==1)process.exit(1)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/foskia/posts/2026-07-06.json public/foskia/posts/index.json .github/workflows/foskia-day6-once.yml
          git commit -m 'Edición de FoskIA del 2026-07-06'
          git push
