name: Publish FoskIA 2026-07-13

on:
  push:
    branches: [main]
    paths:
      - '.foskia-publish-2026-07-13-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate edition and update post index
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sourcePath = '.github/foskia-2026-07-13-source.json';
          const postPath = 'public/foskia/posts/2026-07-13.json';
          const indexPath = 'public/foskia/posts/index.json';
          const expected = ['gaming','gratis','codigo','ciencia','economia','cripto','radar','ia','hardware','security','entretenimiento','curiosidades','ofertas','anime'];
          const langs = ['es','en','val'];
          const forbidden = /^(FoskIA(?:\s+\d{1,2}\/\d{1,2})?:|Edici[oó]n del d[ií]a:|Edition of the day:)/i;

          const edition = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          if (edition.date !== '2026-07-13') throw new Error(`Unexpected date: ${edition.date}`);
          if (!edition.title || langs.some(l => !edition.title[l])) throw new Error('Incomplete root title');
          if (langs.some(l => forbidden.test(edition.title[l]))) throw new Error('Forbidden prefix in root title');
          if (!edition.intro || langs.some(l => !edition.intro[l])) throw new Error('Incomplete intro');

          const actual = edition.sections.map(s => s.category);
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected category order: ${actual.join(',')}`);
          }

          for (const section of edition.sections) {
            if (!Array.isArray(section.items) || section.items.length === 0) {
              throw new Error(`Empty section: ${section.category}`);
            }
            for (const [index, item] of section.items.entries()) {
              if (!item.url || !/^https?:\/\//.test(item.url)) {
                throw new Error(`${section.category}[${index}] has invalid URL`);
              }
              if (section.category === 'ofertas') {
                if (!['es','en','val'].includes(item.market)) throw new Error(`Invalid offer market at ${index}`);
                for (const field of ['title','summary','originalPrice','salePrice','discount','until']) {
                  if (!item[field] || !item[field][item.market]) throw new Error(`Offer ${index} missing ${field}.${item.market}`);
                  for (const lang of langs) {
                    if (lang !== item.market && item[field][lang] !== '') {
                      throw new Error(`Offer ${index} must leave ${field}.${lang} empty`);
                    }
                  }
                }
                if (!item.summary[item.market].includes('<a href=')) {
                  const labels = {es:'Ver fuente', en:'See source', val:'Vore font'};
                  item.summary[item.market] += ` <a href="${item.url}">${labels[item.market]}</a>.`;
                }
              } else {
                for (const field of ['title','summary']) {
                  if (!item[field] || langs.some(l => !item[field][l])) {
                    throw new Error(`${section.category}[${index}] incomplete ${field}`);
                  }
                }
                if (!Array.isArray(item.links) || item.links.length < 3) {
                  throw new Error(`${section.category}[${index}] has fewer than 3 links`);
                }
                for (const source of item.links) {
                  if (!source.url || !/^https?:\/\//.test(source.url)) throw new Error(`Invalid source URL in ${section.category}[${index}]`);
                }
                const labels = {es:'Fuente principal', en:'Primary source', val:'Font principal'};
                for (const lang of langs) {
                  if (!item.summary[lang].includes('<a href=')) {
                    item.summary[lang] += ` <a href="${item.url}">${labels[lang]}</a>.`;
                  }
                }
                if (section.category === 'cripto') {
                  for (const field of ['shortTerm','longTerm']) {
                    if (!item[field] || langs.some(l => !item[field][l])) {
                      throw new Error(`Crypto item ${index} missing ${field}`);
                    }
                  }
                }
              }
            }
          }

          const serialized = JSON.stringify(edition);
          if (serialized.includes('\uFFFD')) throw new Error('Replacement character found');
          if (serialized.includes('FoskIA 13/07:')) throw new Error('Forbidden FoskIA prefix remains');

          fs.mkdirSync('public/foskia/posts', {recursive: true});
          fs.writeFileSync(postPath, JSON.stringify(edition, null, 2) + '\n', 'utf8');

          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          if (!index || !Array.isArray(index.editions)) throw new Error('Unexpected index schema');
          index.editions = index.editions.filter(e => e.date !== edition.date);
          index.editions.push(edition);
          index.editions.sort((a,b) => b.date.localeCompare(a.date));
          if (index.editions.filter(e => e.date === edition.date).length !== 1) throw new Error('Duplicate edition in index');
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n', 'utf8');

          JSON.parse(fs.readFileSync(postPath, 'utf8'));
          JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          console.log(`Validation OK: ${edition.sections.length} sections, ${edition.sections.reduce((n,s)=>n+s.items.length,0)} items, index updated once.`);
          NODE

      - name: Commit edition
        shell: bash
        run: |
          git config user.name "Danielux135"
          git config user.email "dlux135@hotmail.com"
          git add public/foskia/posts/2026-07-13.json public/foskia/posts/index.json
          if git diff --cached --quiet; then
            echo "Edition already published; no empty commit."
            exit 0
          fi
          git commit -m "Edición de FoskIA del 2026-07-13"
          git push origin main
